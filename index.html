<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Poca List</title><link rel="stylesheet" href="style.css"></head><body>
<div id="deleteBar" class="delete-bar hidden"><span id="deleteCount">0개 선택됨</span></div>
<header class="header"><h1 id="appTitle">Poca List</h1><div class="top">
<input id="searchInput" placeholder="검색"><button id="addBtn">+ 추가</button><button onclick="openAdmin()">⚙️ 관리</button><button onclick="toggleDeleteMode()">삭제 모드</button><button onclick="deleteSelected()">선택 삭제</button><button onclick="exportData()">내보내기</button><input type="file" id="importFile" accept=".json" hidden><button onclick="document.getElementById('importFile').click()">불러오기</button>
</div></header><div id="collectionInfo" class="collection-info"></div><div id="groupTabs" class="bar"></div><div id="typeTabs" class="bar"></div><main><div id="cardList"></div></main>
<div id="modal" class="modal hidden"><div class="box"><h3>포카 추가</h3>
<label>종류</label><select id="typeInput"><option>앨범</option><option>특전</option><option>럭드</option><option>팬키트</option><option>시즌그리팅</option><option>MD</option></select>
<div id="dynamicFields"></div>
<input id="nameInput" placeholder="포카 이름 (선택)"><input type="file" id="fileInput" accept="image/*"><div id="imageStatus"></div><button id="saveBtn">저장</button><button onclick="closeModal()">닫기</button></div></div>
<div id="adminPanel" class="modal hidden"><div class="box"><h3>관리</h3><hr><h4>백업</h4><button onclick="exportData()">백업 다운로드</button><button onclick="compressAllImages()">모든 포카 압축</button><small>※ 기존 저화질 이미지는 원본을 다시 올려야 실제 화질이 복구돼.</small><hr>
<h4>앨범 추가</h4><input id="newAlbum" placeholder="앨범 이름"><button onclick="addAlbum()">추가</button><div id="albumAdminList"></div><hr>
<h4>멤버 추가</h4><select id="memberAlbum"></select><input id="newMember" placeholder="멤버 이름"><button onclick="addMember()">추가</button><hr>
<h4>특전 · 럭드 · 팬키트 · 시즌그리팅 · MD 리스트</h4><select id="catalogType"><option>특전</option><option>럭드</option><option>팬키트</option><option>시즌그리팅</option><option>MD</option></select><input id="newCatalogItem" placeholder="예: 2026 / 럭드 A / 팬키트 2025"><button onclick="addCatalogItem()">추가</button><div id="catalogAdminList"></div>
<br><button onclick="closeAdmin()">닫기</button></div></div>
<div id="frame" class="frame hidden"><img id="frameImg"><button id="deleteCardBtn">🗑 삭제</button><button id="closeFrameBtn">닫기</button></div>
<div id="bottomProgress" class="bottom-progress"><span id="progressText">0 / 0 (0%)</span></div>
<script src="db.js"></script><script src="app.js"></script></body></html>
